<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hy">
<head>
    <meta charset="UTF-8">
    <title>To-Do Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9eae1;
            color: #7d4f50;
            padding: 30px;
            margin: 0;
        }
        .container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
        }

        .board-column {
            background: #ffffff;
            border-radius: 12px;
            padding: 18px;
            width: 320px;
            box-shadow: 0 4px 12px rgba(125, 79, 80, 0.08);
            border: 1px solid #d1be9c;
        }
        .board-column h3 {
            margin-top: 0;
            color: #7d4f50;
            border-bottom: 2px solid #f9eae1;
            padding-bottom: 8px;
        }

        .task-card {
            background: #f9eae1;
            border: 1px solid #d1be9c;
            border-left: 5px solid #cc8b86;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
        }
        .completed-column .task-card {
            border-left-color: #aa998f;
            opacity: 0.85;
            background: #ffffff;
        }

        form input, form textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #aa998f;
            border-radius: 6px;
            background: #ffffff;
            color: #7d4f50;
            outline: none;
        }
        form input:focus, form textarea:focus {
            border-color: #7d4f50;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            color: #ffffff;
            margin-top: 5px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }

        .btn-add { background: #7d4f50; width: 100%; padding: 10px; }
        .btn-status { background: #cc8b86; }
        .btn-edit { background: #d1be9c; color: #7d4f50; }
        .btn-delete { background: #aa998f; float: right; }
    </style>
</head>
<body>

<div class="container">
    <div class="board-column">
        <h3>➕ Ավելացնել</h3>
        <form action="/add" method="post">
            <input type="text" name="title" placeholder="Վերնագիր" required>
            <textarea name="description" placeholder="Նկարագրություն" rows="3"></textarea>
            <button type="submit" class="btn btn-add">Ստեղծել</button>
        </form>
    </div>

    <div class="board-column">
        <h3>⏳ Ընթացիկ (To Do)</h3>
        <div th:each="task : ${tasks}" th:if="${!task.completed}" class="task-card">
            <h4 th:text="${task.title}" style="margin: 0 0 8px 0; color: #7d4f50;"></h4>
            <p th:text="${task.description}" style="margin: 0 0 8px 0; color: #aa998f;"></p>
            <small style="color: #aa998f; display: block; margin-bottom: 8px;"
                   th:text="${task.createdAt != null ? #temporals.format(task.createdAt, 'dd.MM.yyyy HH:mm') : ''}">
            </small>
            <a th:href="@{'/status/' + ${task.id}}" class="btn btn-status">✓ Ավարտել</a>
            <a th:href="@{'/edit/' + ${task.id}}" class="btn btn-edit">✏️ Փոխել</a>
            <a th:href="@{'/delete/' + ${task.id}}" class="btn btn-delete">🗑</a>
        </div>
    </div>

    <div class="board-column completed-column">
        <h3>✅ Ավարտված (Done)</h3>
        <div th:each="task : ${tasks}" th:if="${task.completed}" class="task-card">
            <h4 th:text="${task.title}" style="margin: 0 0 8px 0; color: #7d4f50; text-decoration: line-through;"></h4>
            <p th:text="${task.description}" style="margin: 0 0 8px 0; color: #aa998f;"></p>
            <small style="color: #aa998f; display: block; margin-bottom: 8px;"
                   th:text="${task.createdAt != null ? #temporals.format(task.createdAt, 'dd.MM.yyyy HH:mm') : ''}">
            </small>
            <a th:href="@{'/status/' + ${task.id}}" class="btn btn-status">↩ Ոչ ավարտված</a>
            <a th:href="@{'/edit/' + ${task.id}}" class="btn btn-edit">✏️ Փոխել</a>
            <a th:href="@{'/delete/' + ${task.id}}" class="btn btn-delete">🗑</a>
        </div>
    </div>
</div>

</body>
</html>
