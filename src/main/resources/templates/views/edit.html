<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Խմբագրել</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9eae1;
            color: #7d4f50;
            padding: 40px;
            margin: 0;
        }
        .form-box {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 320px;
            margin: 40px auto;
            box-shadow: 0 4px 12px rgba(125, 79, 80, 0.1);
            border: 1px solid #d1be9c;
        }
        .form-box h3 {
            margin-top: 0;
            color: #7d4f50;
            border-bottom: 2px solid #f9eae1;
            padding-bottom: 8px;
        }
        input, textarea {
            width: 100%;
            margin-bottom: 12px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #aa998f;
            border-radius: 6px;
            color: #7d4f50;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #7d4f50;
        }
        button {
            background: #7d4f50;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .cancel-btn {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #aa998f;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }
        .cancel-btn:hover { color: #7d4f50; }
    </style>
</head>
<body>

<div class="form-box">
    <h3>✏️ Խմբագրել</h3>
    <form th:action="@{'/update/' + ${task.id}}" method="post">
        <input type="text" name="title" th:value="${task.title}" required>
        <textarea name="description" th:text="${task.description}" rows="4"></textarea>
        <button type="submit">Պահպանել</button>
        <a href="/" class="cancel-btn">Չեղարկել</a>
    </form>
</div>

</body>
</html>
